# CoAlign on UrbanIng-V2X (train: crossing1/2, validation: crossing1/2).
# +Geo arm, 30 epochs; GeoScaffold supervision in epochs 22-30.
# Seed 1669408686 (pass --seed 1669408686).
# evaluation_seed fixes the point sampling of each evaluation frame (inference only).
name: coalign_geoscaffold
root_dir: datasets/UrbanIng-V2X-OpenCOOD-format/splits/sis/sis_train_crossing1_crossing2_test_crossing3/train
validate_dir: datasets/UrbanIng-V2X-OpenCOOD-format/splits/sis/sis_train_crossing1_crossing2_test_crossing3/val
dataset_format: urbaning
dataset_split: train
yaml_parser: load_point_pillar_params
train_params: {monitor_backbone_health: true, batch_size: 4, epoches: 30, eval_freq: 10, include_infrastructure: true,
  max_cav: 3, min_lidar_hits_per_object: 5, save_freq: 10, seed: 1669408686}
evaluation_seed: 1669408686
wild_setting: {async: false, async_overhead: 100, backbone_delay: 10, data_size: 1.06, loc_err: false,
  ryp_std: 0.2, seed: 20, transmission_speed: 27, xyz_std: 0.2}
fusion:
  args: {proj_first: false, correct_augmented_transforms: true, pack_active_agents: true}
  core_method: LidarIntermediateFusionDataset
box_align:
  train_result: checkpoints/urbaning/coalign/alignment/train_all_agents.json
  val_result: checkpoints/urbaning/coalign/alignment/val_all_agents.json
  args: {backend: scipy_se2, match_distance: 1.5, max_iterations: 1000, adaptive_landmark: false, abandon_hard_cases: true,
    drop_hard_boxes: true, yaw_var_thres: 0.2, landmark_se2: true}
preprocess:
  anchor_generator_config: &anchor_generator_config
  - align_center: true
    anchor_bottom_heights: [-1.78]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [4.0, 1.75, 1.6]
    class_name: Vehicle
    feature_map_stride: 2
    includes_classes: [Car, Van]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-1.78]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [6.0, 2.5, 2.5]
    class_name: Heavy_Vehicle
    feature_map_stride: 2
    includes_classes: [Truck, Bus, Trailer, OtherVehicle]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-0.6]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [2.0, 1.0, 1.5]
    class_name: 2Wheeler
    feature_map_stride: 2
    includes_classes: [Cyclist, Motorcycle, E-Scooter]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-0.6]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [0.8, 0.8, 1.8]
    class_name: Pedestrian
    feature_map_stride: 2
    includes_classes: [Pedestrian, OtherPedestrian]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  args:
    max_points_per_voxel: 32
    max_voxel_test: 70000
    max_voxel_train: 32000
    voxel_size: &voxel_size [0.4, 0.4, 10]
  cav_lidar_range: &cav_lidar_range [-102.4, -40, -5, 102.4, 40, 5]
  cav_lidar_range_validation: [-100, -40, -5, 100, 40, 5]
  core_method: SpVoxelPreprocessor
  num_class: 4
data_augment:
- ALONG_AXIS_LIST: [x]
  NAME: random_world_flip
- NAME: random_world_rotation
  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
- NAME: random_world_scaling
  WORLD_SCALE_RANGE: [0.95, 1.05]
postprocess:
  anchor_args:
    anchor_generator_config: *anchor_generator_config
    cav_lidar_range: *cav_lidar_range
    num: 2
  core_method: CoAlignVoxelPostprocessor
  max_num: 150
  nms_thresh: 0.15
  order: hwl
  target_args: {score_threshold: 0.2}
  dir_args: {dir_offset: 0.7853, num_bins: 2}
model:
  args:
    anchor_num: 2
    anchor_number: 2
    backbone_fix: false
    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      num_upsample_filter: [128, 128, 128]
      upsample_strides: [1, 2, 4]
    compression: 0
    lidar_range: *cav_lidar_range
    max_cav: 3
    num_class: 4
    pillar_vfe:
      num_filters: [64]
      use_absolute_xyz: true
      use_norm: true
      with_distance: false
    point_pillar_scatter: {num_features: 64}
    shrink_header:
      kernal_size: [3]
      stride: [1]
      padding: [1]
      dim: [256]
      input_dim: 384
    voxel_size: *voxel_size
    geometry_scaffold: {enabled: true, hidden_channels: 128, roi_size: 7, mask_size: 28}
    att:
      feat_dim: [64, 128, 256]
    dir_args: {dir_offset: 0.7853, num_bins: 2}
  core_method: lidar.point_pillar_coalign_native
loss:
  core_method: point_pillar_coalign_loss
  args:
    num_class: 4
    cls_weight: 2.0
    reg: 2.0
    pos_cls_weight: 2.0
    cls: {alpha: 0.25, gamma: 2.0, weight: 2.0}
    regression: {sigma: 3.0, weight: 2.0}
    dir_args:
      dir_offset: 0.7853
      num_bins: 2
      anchor_yaw: [0, 1.57, 0, 1.57, 0, 1.57, 0, 1.57]
      weight: 0.2
    geometry_scaffold: {weight: 1.0}
optimizer:
  core_method: Adam
  lr: 0.002
  args: {eps: 1.0e-10, weight_decay: 0.0001}
lr_scheduler:
  core_method: multistep
  gamma: 0.1
  step_size: [10, 15]
