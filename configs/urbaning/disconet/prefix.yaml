# DiscoNet on UrbanIng-V2X (train: crossing1/2, validation: crossing1/2).
# Shared Native prefix: epochs 1-11. See docs/training.md.
# Seed 1669408686 (pass --seed 1669408686).
name: disconet_prefix
root_dir: datasets/UrbanIng-V2X-OpenCOOD-format/splits/sis/sis_train_crossing1_crossing2_test_crossing3/train
validate_dir: datasets/UrbanIng-V2X-OpenCOOD-format/splits/sis/sis_train_crossing1_crossing2_test_crossing3/val
yaml_parser: load_point_pillar_params
train_params: {batch_size: 4, epoches: 11, eval_freq: 10, include_infrastructure: true, max_cav: 3, min_lidar_hits_per_object: 5,
  save_freq: 10, seed: 1669408686}
wild_setting: {async: false, async_overhead: 100, backbone_delay: 10, data_size: 1.06, loc_err: false,
  ryp_std: 0.2, seed: 20, transmission_speed: 27, xyz_std: 0.2}
fusion:
  args: {}
  core_method: LidarIntermediateFusionDataset
kd_flag: true
preprocess:
  anchor_generator_config: &anchor_generator_config
  - align_center: true
    anchor_bottom_heights: [-1.78]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [4.0, 1.75, 1.6]
    class_name: Vehicle
    feature_map_stride: 2
    includes_classes: [Car, Van]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-1.78]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [6.0, 2.5, 2.5]
    class_name: Heavy_Vehicle
    feature_map_stride: 2
    includes_classes: [Truck, Bus, Trailer, OtherVehicle]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-0.6]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [2.0, 1.0, 1.5]
    class_name: 2Wheeler
    feature_map_stride: 2
    includes_classes: [Cyclist, Motorcycle, E-Scooter]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-0.6]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [0.8, 0.8, 1.8]
    class_name: Pedestrian
    feature_map_stride: 2
    includes_classes: [Pedestrian, OtherPedestrian]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  args:
    max_points_per_voxel: 32
    max_voxel_test: 70000
    max_voxel_train: 32000
    voxel_size: &voxel_size [0.4, 0.4, 10]
  cav_lidar_range: &cav_lidar_range [-102.4, -40, -5, 102.4, 40, 5]
  cav_lidar_range_validation: [-100, -40, -5, 100, 40, 5]
  core_method: SpVoxelPreprocessor
  num_class: 4
teacher_preprocess:
  anchor_generator_config:
  - align_center: true
    anchor_bottom_heights: [-1.78]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [4.0, 1.75, 1.6]
    class_name: Vehicle
    feature_map_stride: 2
    includes_classes: [Car, Van]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-1.78]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [6.0, 2.5, 2.5]
    class_name: Heavy_Vehicle
    feature_map_stride: 2
    includes_classes: [Truck, Bus, Trailer, OtherVehicle]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-0.6]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [2.0, 1.0, 1.5]
    class_name: 2Wheeler
    feature_map_stride: 2
    includes_classes: [Cyclist, Motorcycle, E-Scooter]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  - align_center: true
    anchor_bottom_heights: [-0.6]
    anchor_rotations: [0, 1.57]
    anchor_sizes:
    - [0.8, 0.8, 1.8]
    class_name: Pedestrian
    feature_map_stride: 2
    includes_classes: [Pedestrian, OtherPedestrian]
    matched_threshold: 0.6
    unmatched_threshold: 0.45
  args:
    max_points_per_voxel: 32
    max_voxel_test: 70000
    max_voxel_train: 32000
    voxel_size: [0.4, 0.4, 20]
  cav_lidar_range: [-102.4, -40, -10, 102.4, 40, 10]
  cav_lidar_range_validation: [-100, -40, -10, 100, 40, 10]
  core_method: SpVoxelPreprocessor
  num_class: 4
data_augment:
- ALONG_AXIS_LIST: [x]
  NAME: random_world_flip
- NAME: random_world_rotation
  WORLD_ROT_ANGLE: [-0.78539816, 0.78539816]
- NAME: random_world_scaling
  WORLD_SCALE_RANGE: [0.95, 1.05]
postprocess:
  anchor_args:
    anchor_generator_config: *anchor_generator_config
    cav_lidar_range: *cav_lidar_range
    num: 2
  core_method: VoxelPostprocessor
  max_num: 150
  nms_thresh: 0.15
  order: hwl
  target_args: {score_threshold: 0.2}
model:
  args:
    anchor_num: 2
    anchor_number: 2
    backbone_fix: false
    base_bev_backbone:
      layer_nums: [3, 5, 8]
      layer_strides: [2, 2, 2]
      num_filters: [64, 128, 256]
      num_upsample_filter: [128, 128, 128]
      upsample_strides: [1, 2, 4]
    compression: 0
    lidar_range: *cav_lidar_range
    max_cav: 3
    num_class: 4
    pillar_vfe:
      num_filters: [64]
      use_absolute_xyz: true
      use_norm: true
      with_distance: false
    point_pillar_scatter: {num_features: 64}
    shrink_header:
      dim: [256]
      input_dim: 384
      kernal_size: [1]
      padding: [0]
      stride: [1]
    voxel_size: *voxel_size
    geometry_scaffold: {enabled: false, hidden_channels: 128, roi_size: 7, mask_size: 28}
    teacher:
      enabled: true
      checkpoint_path: checkpoints/urbaning/early_fusion/native/net_epoch20.pth
      model_config:
        anchor_num: 2
        anchor_number: 2
        base_bev_backbone:
          layer_nums: [3, 5, 8]
          layer_strides: [2, 2, 2]
          num_filters: [64, 128, 256]
          num_upsample_filter: [128, 128, 128]
          upsample_strides: [1, 2, 4]
        lidar_range: [-102.4, -40, -10, 102.4, 40, 10]
        num_class: 4
        pillar_vfe:
          num_filters: [64]
          use_absolute_xyz: true
          use_norm: true
          with_distance: false
        point_pillar_scatter:
          grid_size: [512, 200, 1]
          num_features: 64
        voxel_size: [0.4, 0.4, 20]
        geometry_scaffold: {enabled: false, hidden_channels: 128, roi_size: 7, mask_size: 28}
        counterfactual_training: {mode: disabled, detach_base: false}
      strict: false
      freeze: true
    disconet_fusion:
      in_channels: 256
      use_temporal_encoding: false
      resolution: 0.4
      downsample_rate: 2
      num_iteration: 1
      gru_flag: false
      agg_operator: avg
      use_mask: false
      conv_gru:
        H: 100
        W: 256
        kernel_size:
        - [3, 3]
        num_layers: 1
  core_method: lidar.point_pillar_disconet
loss:
  args:
    cls_weight: 1.0
    num_class: 4
    reg: 2.0
    geometry_scaffold: {weight: 0.0}
    kd: {weight: 0.5, decoder_kd: false, temperature: 1.0}
  core_method: point_pillar_disconet_loss
optimizer:
  args: {eps: 1.0e-10, weight_decay: 0.0001}
  core_method: Adam
  lr: 0.001
lr_scheduler: {core_method: cosineannealwarm, epoches: 20, lr_min: 2.0e-05, warmup_epoches: 10, warmup_lr: 0.0002}
